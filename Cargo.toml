[package]
name = "rugst"
version = "0.2.4"
edition = "2024"
description = "Local semantic memory store with SQLite, FastEmbed, and time-based decay."
license = "MIT"
repository = "https://github.com/harunya0/rugst"
readme = "README.md"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE"
]

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
anyhow = "1.0.103"
fastembed = {
    version = "5.17.4",
    default-features = false,
    features = [
        "hf-hub",
        "ort-download-binaries-rustls-tls",
    ]
}

[lib]
name = "rugst"
crate-type = ["rlib", "cdylib"]