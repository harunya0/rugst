name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Pack
      shell: pwsh
      run: |
        $VERSION = "${{ github.ref_name }}".TrimStart('v')
        dotnet pack dotnet/Rugst.NET/Rugst.NET.csproj -c Release -o ${{ github.workspace }}/output /p:PackageVersion=$VERSION

    - name: Push to NuGet
      shell: pwsh
      run: |
        $NUPKG = (Get-Item ${{ github.workspace }}/output/*.nupkg).FullName
        dotnet nuget push $NUPKG --source https://api.nuget.org/v3/index.json