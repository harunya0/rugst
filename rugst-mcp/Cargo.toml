[package]
name = "rugst-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rugst = { version = "0.2.7", path = ".." }
rmcp = { version = "3.1.2", features = ["transport-io"] }
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "io-std",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
schemars = "1"