[package]
name = "rugst-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for local semantic memory with Rugst, SQLite, and FastEmbed."
license = "MIT"
repository = "https://github.com/harunya0/rugst"
readme = "README.md"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE"
]

[dependencies]
rugst = { version = "0.2.7", path = ".." }
rmcp = { version = "3.1.2", features = ["transport-io"] }
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "io-std",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
schemars = "1"